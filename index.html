<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhinav Kumawat | Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main class="main">
      <!-- =========================
          SIDEBAR
    ========================= -->

      <aside class="sidebar" data-sidebar>
        <!-- Show Contacts Button -->
        <button class="info-more-btn" data-sidebar-btn>
          <span>Show Contacts</span>

          <ion-icon name="chevron-down"></ion-icon>
        </button>

        <!-- Sidebar Content -->
        <div class="sidebar-top-info">
          <!-- Avatar -->
          <figure class="avatar-box">
            <img src="./assets/images/my-avatar1.jpeg" alt="Abhinav Kumawat" />
          </figure>

          <!-- User Details -->
          <div class="display-content">
            <h1 class="name">Abhinav Kumawat</h1>

            <p class="title">Java Full Stack Developer</p>
          </div>
        </div>

        <!-- Contact List -->
        <div class="sidebar-info-more">
          <div class="separator"></div>
          <ul class="contacts-list">
            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="mail-outline"></ion-icon>
              </div>

              <div class="contact-info">
                <p class="contact-title">Email</p>

                <a
                  href="mailto:abhinavkumawat442@gmail.com"
                  class="contact-link"
                >
                  abhinavkumawat442@gmail.com
                </a>
              </div>
            </li>

            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="call-outline"></ion-icon>
              </div>

              <div class="contact-info">
                <p class="contact-title">Phone</p>

                <a href="tel:+919928833692" class="contact-link">
                  +91 99288 33692
                </a>
              </div>
            </li>

            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="calendar-outline"></ion-icon>
              </div>

              <div class="contact-info">
                <p class="contact-title">Birthday</p>

                <time datetime="2002-12-10"> 10 December 2002 </time>
              </div>
            </li>

            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="location-outline"></ion-icon>
              </div>

              <div class="contact-info">
                <p class="contact-title">Location</p>

                <address>Jaipur, Rajasthan, India</address>
              </div>
            </li>
          </ul>

          <div class="separator"></div>

          <!-- Social Links -->

          <ul class="social-list">
            <li>
              <a
                href="https://github.com/Abhinav1735"
                class="social-link"
                target="_blank"
              >
                <ion-icon name="logo-github"></ion-icon>
              </a>
            </li>

            <li>
              <a
                href="https://www.linkedin.com/in/-abhinavkumawat/"
                class="social-link"
                target="_blank"
              >
                <ion-icon name="logo-linkedin"></ion-icon>
              </a>
            </li>

            <li>
              <a href="#" class="social-link">
                <ion-icon name="logo-instagram"></ion-icon>
              </a>
            </li>
          </ul>
          <div class="separator"></div>

          <!-- Resume Download -->
          <div class="resume-down">
            <a
              href="./assets/resume/Abhinav_Kumawat_Resume.pdf"
              class="resume-btn"
              target="_blank"
            >
              <ion-icon name="download-outline"></ion-icon>
              Download Resume
            </a>
          </div>
        </div>
      </aside>

      <!-- =========================
          MAIN CONTENT
    ========================= -->
      <div class="main-content">
        <nav class="navbar"></nav>

        <article class="about active"></article>
      </div>
    </main>

    <!-- Ionicons -->

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>

    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <script src="./assets/js/script.js"></script>
  </body>
</html>
