<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abhinav Kumawat | Portfolio</title>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <main>
      <aside class="sidebar" data-sidebar>
        <div class="sidebar-info">
          <figure class="avatar-box">
            <img
              src="./assets/images/my-avatar.png"
              alt="Abhinav Kumawat"
              width="80"
            />
          </figure>
          <div class="info-content">
            <h1 class="name" title="Abhinav Kumawat">Abhinav Kumawat</h1>

            <p class="title">Java Full Stack Developer</p>
          </div>
          <button class="info_more-btn" data-sidebar-btn>
            <span> Show Contacts </span>
            <ion-icon name="chevron-down"> </ion-icon>
          </button>
        </div>
        <div class="sidebar-info_more">
          <div class="separator"></div>

          <ul class="contacts-list">
            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="mail-outline"></ion-icon>
              </div>
              <div class="contact-info">
                <p class="contact-title">Email</p>
                <a
                  href="mailto:abhinavkumawat442@gmail.com"
                  class="contact-link"
                >
                  abhinavkumawat442@gmail.com
                </a>
              </div>
            </li>
            <!-- --------------------------------------------------------------------- -->
            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="phone-portrait-outline"></ion-icon>
              </div>
              <div class="contact-info">
                <p class="contact-title">Phone</p>
                <a href="tel:+919928833692" class="contact-link">
                  +91 9928833692
                </a>
              </div>
            </li>
            <!-- --------------------------------------------------------------------- -->
            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="calendar-outline"></ion-icon>
              </div>

              <div class="contact-info">
                <p class="contact-title">Birthday</p>

                <time datetime="2002-12-10"> 10 December, 2002 </time>
              </div>
            </li>
            <!-- --------------------------------------------------------------------- -->
            <li class="contact-item">
              <div class="icon-box">
                <ion-icon name="location-outline"></ion-icon>
              </div>

              <div class="contact-info">
                <p class="contact-title">Location</p>

                <address>Jaipur, Rajasthan, India</address>
              </div>
            </li>
            <!-- --------------------------------------------------------------------- -->
          </ul>
          <div class="separator"></div>
          <ul class="social-list">
            <li class="social-item">
              <a
                href="https://github.com/yourusername"
                class="social-link"
                target="_blank"
                rel="noopener noreferrer"
              >
                <ion-icon name="logo-github"></ion-icon>
              </a>
            </li>
            <!-- --------------------------------------------------------------------- -->
            <li class="social-item">
              <a
                href="https://linkedin.com/in/yourusername"
                class="social-link"
                target="_blank"
                rel="noopener noreferrer"
              >
                <ion-icon name="logo-linkedin"></ion-icon>
              </a>
            </li>
          </ul>
          <!-- --------------------------------------------------------------------- -->
          <div class="separator"></div>
          <a
            href="./assets/resume/Abhinav_Kumawat_Resume.pdf"
            target="_blank"
            class="resume-btn"
            rel="noopener noreferrer"
          >
            <ion-icon name="document-text-outline"></ion-icon>

            <span>View Resume</span>
          </a>
        </div>
      </aside>
    </main>

    <script src="assets/js/script.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>

    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
